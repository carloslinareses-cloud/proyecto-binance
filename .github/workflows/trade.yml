name: paper-trader

on:
  schedule:
    # Cada 15 minutos (hora UTC). Nota: los cron de GitHub son "best-effort"
    # y pueden retrasarse algunos minutos en momentos de mucha carga.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # permite ejecutarlo manualmente desde la pestaña Actions
  push:
    branches: [ main ]    # corre tambien al hacer push (util para la 1a vez)

# Necesario para que la Action pueda commitear los datos de vuelta al repo
permissions:
  contents: write

# Evita que dos ejecuciones se pisen si una se retrasa
concurrency:
  group: paper-trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar paper trader (SIMULACION)
        run: python paper_trader.py

      - name: Commit y push de resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/state.json docs/data/history.csv
          if git diff --staged --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "chore: actualizar datos de paper-trading [skip ci]"
            git push
          fi
